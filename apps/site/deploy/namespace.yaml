# silicaui's own namespace on the shared AKS cluster — self-contained, the way
# kanNINJA's workloads live in `kanninja`. Nothing here reaches into sparx-prod
# except the single Caddy host block, which lives in wize-infrastructure's
# config (k8s/ingress/Caddyfile), not here.
apiVersion: v1
kind: Namespace
metadata:
  name: silicaui
  labels:
    app.kubernetes.io/name: silicaui-site
