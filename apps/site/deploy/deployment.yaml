apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: silicaui
  labels:
    app.kubernetes.io/name: silicaui-site
spec:
  # Two replicas so a rollout never drops the site. The AKS cluster is a single
  # node today, so this buys ROLLOUT safety, not node-failure safety — with the
  # default RollingUpdate strategy one pod keeps serving while the other is
  # replaced. It's a static nginx image, so the second pod is nearly free.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: silicaui-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silicaui-site
    spec:
      # No imagePullSecrets: the GHCR package is PUBLIC, so the kubelet pulls
      # anonymously. This is deliberate, not an oversight.
      #
      # It used to carry a `ghcr` Secret that CI rebuilt from the run-scoped
      # GITHUB_TOKEN on every deploy. That token is REVOKED when the workflow run
      # ends, so the credential in the cluster was dead minutes after each deploy —
      # pulls only ever succeeded during the rollout itself, while the token was
      # still alive. The bill came due when AKS replaced the node: the pods
      # rescheduled onto a fresh image cache, re-pulled with the revoked token, and
      # sat in ImagePullBackOff for six days (403 from the GHCR token endpoint).
      #
      # The image is nginx plus the static `out/` export this site already serves
      # publicly, so a private package was protecting nothing. Public + anonymous
      # removes the credential — and its expiry — from the path entirely.
      containers:
        - name: site
          # CI rewrites this tag to the immutable sha-<gitsha> it just pushed
          # (see kustomization.yaml `images:`). `latest` is only a placeholder
          # so the manifest is valid on its own.
          image: ghcr.io/silicaui/silicaui/site:latest
          ports:
            - name: http
              containerPort: 8080
          # Sized for the shared 2-vCPU AKS node, which already sits near 70% of
          # its allocatable CPU *requests* before this workload lands. The old
          # 100m request was written for GKE Autopilot, where the request buys a
          # node; here it competes with the whole sparx platform for one. A
          # static file server needs essentially nothing at rest, and the limit
          # is burst headroom for a crawl or a launch spike.
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          # nginx-unprivileged already runs as non-root (uid 101); make it
          # explicit and drop everything the container cannot need.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
