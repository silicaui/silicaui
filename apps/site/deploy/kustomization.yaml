# Ties the workload manifests together and gives CI a clean, race-free way to
# pin the image tag it just pushed:
#
#   kubectl apply -k apps/site/deploy
#   kubectl set image deployment/site site=ghcr.io/silicaui/silicaui/site:sha-<gitsha> -n silicaui
#
# The ingress layer is deliberately NOT here. silicaui.com is a host block in
# the sparx Caddyfile (`k8s/ingress/Caddyfile` in the sparx repo), which already
# reverse-proxies to the `site` Service these manifests create. See
# caddy-silicaui.caddyfile for the block and why it is owned over there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: site
    newName: ghcr.io/silicaui/silicaui/site
    newTag: latest
