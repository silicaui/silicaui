# Ties the workload manifests together and gives CI a clean, race-free way to
# pin the image tag it just pushed:
#
#   kubectl apply -k apps/site/deploy
#   kubectl set image deployment/site site=ghcr.io/silicaui/silicaui/site:sha-<gitsha> -n silicaui
#
# The ingress layer is deliberately NOT here. silicaui.com is a host block in
# the sparx Caddyfile (`k8s/ingress/Caddyfile` in the sparx repo), which already
# reverse-proxies to the `site` Service these manifests create. See
# caddy-silicaui.caddyfile for the block and why it is owned over there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# `name:` is a SELECTOR — it must equal the image name as it appears in
# deployment.yaml, not the name being selected for. It read `site` (with a
# `newName` doing the rewriting), which matched no container, so `newTag` was
# inert and every build resolved to `:latest` no matter what CI substituted.
# The old GCP workflow hid this by following `apply -k` with `kubectl set
# image`, which pinned the tag by a second path; this one applies once, so the
# overlay has to be right. The guard in the `deploy` job of .github/workflows/ci.yml
# is what caught it.
images:
  - name: ghcr.io/silicaui/silicaui/site
    newTag: latest
